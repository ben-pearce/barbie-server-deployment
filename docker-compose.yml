name: barbie-server-deployment
include:
  - stacks/docker-compose.monitoring.yml
services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.8@sha256:5bd8439a648c26dd9f11fb4e3a54c6bd964babf4eabf5060bde8d58b51cdc0ee
    container_name: borgmatic
    depends_on:
      - rclone
    volumes:
      - ${DATA_DIR}/repository:/mnt/repository:shared
      - ${DATA_DIR}/borgmatic/config:/etc/borgmatic.d
      - ${DATA_DIR}/borgmatic/sources:/mnt/sources
      - ${DATA_DIR}/borgmatic/cache:/root/.cache/borg
      - ${DATA_DIR}/borgmatic/borg:/root/.config/borg
      - ${DATA_DIR}/borgmatic/state:/root/.local/state/borgmatic
      - cloud:/mnt/sources/barbie/cloud
      - workspaces:/mnt/sources/barbie/workspaces
      - ./borgmatic/crontab.txt:/etc/borgmatic.d/crontab.txt:ro
      - ./borgmatic/hooks:/usr/local/bin/hooks:ro
      - ./borgmatic/borgmatic:/usr/local/bin/borgmatic:ro
    secrets:
      - smtp_password
      - borg_passphrase
      - borg_user_private_key
    environment:
      TZ: ${TZ}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      FILE__SMTP_PASSWORD: /run/secrets/smtp_password
    restart: unless-stopped
    labels:
      readme.description: Simple, configuration-driven backup software.
      readme.links.github: https://github.com/borgmatic-collective/borgmatic
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
  rclone:
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    container_name: rclone
    volumes:
      - ${DATA_DIR}/repository:/mnt/repository:shared
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/fuse.conf:/etc/fuse.conf:ro
    secrets:
      - rclone_config
    environment:
      RCLONE_CONFIG: /run/secrets/rclone_config
    command: >-
      mount blaze:borgmatic /mnt/repository 
        --allow-non-empty 
        --vfs-cache-max-size 10G 
        --vfs-write-back 10s 
        --vfs-write-wait 30s 
        --vfs-cache-mode full 
        --cache-dir=/tmp/cache
    restart: unless-stopped
    labels:
      readme.description: >-
        Command-line program to sync files and directories to and from different cloud storage providers.
      readme.links.web: https://rclone.org/
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
volumes:
  cloud:
    driver_opts:
      type: 'nfs'
      o: 'addr=${NFS_HOST},nolock,soft,nfsvers=4'
      device: ':/mnt/turbo/cloud'
  workspaces:
    driver_opts:
      type: 'nfs'
      o: 'addr=${NFS_HOST},nolock,soft,nfsvers=4'
      device: ':/mnt/turbo/workspaces'
secrets:
  smtp_password:
    file: ./.secrets/smtp_password
  borg_passphrase:
    file: ./.secrets/borg_passphrase
  borg_user_private_key:
    file: ./.secrets/borg_user_private_key
  rclone_config:
    file: ./.secrets/rclone_config
